name: Deploy to avielresnick.com/oceans-eleven

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      - name: Deploy to Aviel-Resnick.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: Aviel-Resnick/Aviel-Resnick.github.io
          publish_branch: master
          publish_dir: ./dist
          destination_dir: oceans-eleven
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy oceans-eleven: ${{ github.event.head_commit.message }}"
